name: Deploy to GitHub Pages

# A merged pull request updates main, which emits this push event.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify publish bundle
        run: python -m unittest discover -s tests -p test_pages_bundle.py

      - name: Stage active prototype runtime
        run: python scripts/build_pages.py --output .pages-site

      # Enable Pages once in repository Settings > Pages, with Source = GitHub Actions.
      # Do not use enablement: true with GITHUB_TOKEN: it cannot create a Pages site.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
