name: v3.1 traceability negative tests
on:
  push:
    branches: [codex/v31-source-traceability-20261024]
  pull_request:
    paths:
      - "js/**"
      - "index.html"
      - "tests/**"
      - ".github/workflows/v31-traceability.yml"
jobs:
  negative-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Node version
        run: node --version
      - name: Syntax-check changed JavaScript
        run: |
          for file in js/source_inventory.js js/output_inventory.js js/conversion_ledger.js js/diff_engine.js js/audit_export.js js/diff_tab.js js/app.js js/docx_parser.js js/settings_tab.js tests/diff_engine.test.js tests/audit_export.test.js; do
            node --check "$file"
          done
      - name: Run occurrence and export negative cases
        run: node --test tests/diff_engine.test.js tests/audit_export.test.js
      - name: Assert tab and legacy macro anchors
        run: |
          node -e "const f=require('fs');const h=f.readFileSync('index.html','utf8');const a=f.readFileSync('js/app.js','utf8');if(!h.includes('data-tab=\"diffhtml\"')||!h.includes('data-tab=\"record\"')||!a.includes('renderBatchTab()'))process.exit(1)"
