name: v3.1 traceability negative tests
on:
  push:
    branches: [codex/v31-source-traceability-20261024]
  pull_request:
    paths:
      - "js/**"
      - "index.html"
      - "tests/**"
      - ".github/workflows/v31-traceability.yml"
jobs:
  negative-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Node version
        run: node --version
      - name: Syntax-check changed JavaScript
        run: |
          for file in js/source_inventory.js js/output_inventory.js js/conversion_ledger.js js/diff_engine.js js/audit_export.js js/diff_tab.js js/app.js js/docx_parser.js js/settings_tab.js tests/diff_engine.test.js tests/audit_export.test.js tests/source_inventory.test.js tests/output_inventory.test.js; do
            node --check "$file"
          done
      - name: Run occurrence and export negative cases
        run: node --test tests/diff_engine.test.js tests/audit_export.test.js tests/source_inventory.test.js tests/output_inventory.test.js
      - name: Assert tab and legacy macro anchors
        run: |
          node -e "const f=require('fs');const h=f.readFileSync('index.html','utf8');const a=f.readFileSync('js/app.js','utf8');if(!h.includes('data-tab=\"diffhtml\"')||!h.includes('data-tab=\"record\"')||!a.includes('renderBatchTab()'))process.exit(1)"
      - name: Browser smoke (static, nonpublishing Chromium)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/v31-http.log 2>&1 &
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then echo 'Chrome/Chromium unavailable'; exit 1; fi
          timeout 70 "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=25000 \
            --dump-dom http://127.0.0.1:8765/tests/browser_harness.html >/tmp/v31-browser-dom.html 2>/tmp/v31-browser-stderr.txt
          grep -q '<pre id="test-result">PASS: Browser DOCX extraction' /tmp/v31-browser-dom.html || {
            grep -o '<pre id="test-result">FAIL:[^<]*' /tmp/v31-browser-dom.html || true
            tail -50 /tmp/v31-browser-stderr.txt
            exit 1
          }
          grep -o '<pre id="test-result">PASS: Browser DOCX extraction[^<]*' /tmp/v31-browser-dom.html
